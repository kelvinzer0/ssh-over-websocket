version: 2
project_name: ssh-gateway
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/ssh-gateway
    binary: ssh-gateway
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
